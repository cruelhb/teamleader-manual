# 관리자 화면(/admin) 설정 파일
#
# 여기서 정한 항목이 글쓰기 화면의 입력칸이 됩니다.
# 입력칸을 늘리거나 설명을 바꾸려면 이 파일을 고치면 됩니다.
# 단, src/content.config.ts 의 항목과 이름이 맞아야 합니다.

backend:
  name: github
  repo: cruelhb/teamleader-manual
  branch: main
  # GitHub 로그인 중계 서버(Cloudflare Workers).
  # 이 줄이 있어야 "Sign In with GitHub" 버튼이 동작합니다.
  # 없으면 Netlify 인증 서버를 찾다가 Not Found 오류가 납니다.
  base_url: https://sveltia-cms-auth.onelight0913.workers.dev

# 관리자 화면에서 "사이트 보기" 링크가 가리키는 주소
site_url: https://teamleader-manual.pages.dev

# 이미지 업로드 위치. 화면에서 드래그하면 여기에 저장됩니다.
media_folder: public/img
public_folder: /img

# 한글 제목을 그대로 파일 이름(주소)으로 쓰기 위한 설정.
# 이게 없으면 "경조사-안내" 가 빈 문자열이 되어버립니다.
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'

# 미리보기 창은 실제 사이트와 디자인이 달라 오히려 헷갈리므로 끕니다.
# 저장 후 사이트에서 확인하세요.
editor:
  preview: false

collections:
  # ────────────────────────────── 공지사항
  - name: notice
    label: 공지사항
    label_singular: 공지
    description: 전 인원 공통 공지입니다. 중요한 공지는 상단 고정을 켜세요.
    folder: src/content/notice
    create: true
    slug: '{{title}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [updated, title]
    fields:
      - name: title
        label: 제목
        widget: string
        hint: 팀원이 실제로 검색할 단어를 그대로 쓰세요.
      - name: summary
        label: 한 줄 요약
        widget: text
        hint: 검색 결과와 카카오톡 미리보기에 그대로 표시됩니다.
      - name: tags
        label: 검색 키워드
        widget: list
        required: false
        hint: 제목에 없는 다른 표현을 넣으면 검색이 잘 됩니다.
      - name: updated
        label: 최종 수정일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        format: YYYY-MM-DD
        hint: 내용을 고칠 때마다 오늘 날짜로 바꿔주세요. 문서 상단에 표시됩니다.
      - name: noticeStatus
        label: 공지 상태
        widget: select
        default: active
        options:
          - { label: 일반 (종료일에 따라 자동 종료), value: active }
          - { label: 종료, value: closed }
          - { label: 보관, value: archived }
      - name: endsOn
        label: 종료일
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: false
        hint: 한국 시간으로 이날까지 유효합니다. 다음 날부터 종료 표시되며 홈 최신 공지에서 제외됩니다. 상시 공지는 비워 두세요.
      - name: pinned
        label: 상단 고정
        widget: boolean
        default: false
        required: false
        hint: 켜면 목록 맨 위에 "중요" 표시로 고정됩니다.
      - name: quickSummary
        label: 핵심 요약
        widget: object
        required: false
        collapsed: true
        hint: 본문을 수정할 때 요약도 함께 확인해 주세요. 비운 항목은 표시하지 않습니다.
        fields:
          - { name: audience, label: 대상, widget: text, required: false }
          - { name: keyPoint, label: 핵심 기준, widget: text, required: false }
          - { name: action, label: 처리 방법, widget: text, required: false }
      - name: relatedDocs
        label: 함께 보면 좋은 문서
        widget: list
        required: false
        hint: 최대 3개. 연결할 문서의 주소에서 도메인을 뺀 경로를 입력하세요. 예) /guide/ojt-프로세스-및-진행방법/
        field: { name: path, label: 문서 경로, widget: string }
      - name: body
        label: 본문
        widget: markdown
        modes: [raw, rich_text]

  # ────────────────────────────── 업무 매뉴얼
  - name: guide
    label: 업무 매뉴얼
    label_singular: 업무 매뉴얼 문서
    description: 전산·시스템 사용법을 화면 캡처와 함께 단계별로 안내합니다.
    folder: src/content/guide
    create: true
    slug: '{{title}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [order, updated, title]
    fields:
      - name: title
        label: 제목
        widget: string
      - name: summary
        label: 한 줄 요약
        widget: text
        hint: 검색 결과와 카카오톡 미리보기에 그대로 표시됩니다.
      - name: tags
        label: 검색 키워드
        widget: list
        required: false
      - name: updated
        label: 최종 수정일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        format: YYYY-MM-DD
      - name: order
        label: 정렬 순서
        widget: number
        required: false
        value_type: int
        hint: 숫자가 작을수록 목록 위에 옵니다. 비워두면 수정일 최신순.
      - name: quickSummary
        label: 핵심 요약
        widget: object
        required: false
        collapsed: true
        hint: 본문을 수정할 때 요약도 함께 확인해 주세요. 비운 항목은 표시하지 않습니다.
        fields:
          - { name: audience, label: 대상, widget: text, required: false }
          - { name: keyPoint, label: 핵심 기준, widget: text, required: false }
          - { name: action, label: 처리 방법, widget: text, required: false }
      - name: relatedDocs
        label: 함께 보면 좋은 문서
        widget: list
        required: false
        hint: 최대 3개. 연결할 문서의 주소에서 도메인을 뺀 경로를 입력하세요. 예) /guide/ojt-프로세스-및-진행방법/
        field: { name: path, label: 문서 경로, widget: string }
      - name: body
        label: 본문
        widget: markdown
        modes: [raw, rich_text]
        hint: 캡처는 본문 안에서 드래그해서 올리면 됩니다.

  # ────────────────────────────── 기준 및 규정
  - name: welfare
    label: 기준 및 규정
    label_singular: 기준·규정 문서
    description: 연차, 경조사, 교육비 등 전 인원 공통 규정입니다.
    folder: src/content/welfare
    create: true
    slug: '{{title}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [order, updated, title]
    fields:
      - name: title
        label: 제목
        widget: string
      - name: summary
        label: 한 줄 요약
        widget: text
        hint: 검색 결과와 카카오톡 미리보기에 그대로 표시됩니다.
      - name: tags
        label: 검색 키워드
        widget: list
        required: false
      - name: updated
        label: 최종 수정일
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        format: YYYY-MM-DD
      - name: source
        label: 근거 규정
        widget: string
        required: false
        hint: 예) 취업규칙 제32조. 비워두면 표시되지 않습니다.
      - name: order
        label: 정렬 순서
        widget: number
        required: false
        value_type: int
      - name: quickSummary
        label: 핵심 요약
        widget: object
        required: false
        collapsed: true
        hint: 본문을 수정할 때 요약도 함께 확인해 주세요. 비운 항목은 표시하지 않습니다.
        fields:
          - { name: audience, label: 대상, widget: text, required: false }
          - { name: keyPoint, label: 핵심 기준, widget: text, required: false }
          - { name: action, label: 처리 방법, widget: text, required: false }
      - name: relatedDocs
        label: 함께 보면 좋은 문서
        widget: list
        required: false
        hint: 최대 3개. 연결할 문서의 주소에서 도메인을 뺀 경로를 입력하세요. 예) /guide/ojt-프로세스-및-진행방법/
        field: { name: path, label: 문서 경로, widget: string }
      - name: body
        label: 본문
        widget: markdown
        modes: [raw, rich_text]
